<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta</title>
  <link rel="stylesheet" href="/Style.css">
</head>
<body>
<div class="auth-wrapper">

  <!-- Panel izquierdo decorativo -->
  <div class="auth-panel">
    <div class="auth-panel-title">Únete a la plataforma institucional</div>
    <p class="auth-panel-sub">Regístrate para acceder a eventos académicos, talleres, seminarios y más.</p>
    <div class="auth-panel-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- Panel derecho — formulario -->
  <div class="auth-form-panel">
    <div class="auth-form-box">

      <p class="auth-eyebrow">Registro</p>
      <h2>Crear Cuenta</h2>
      <div class="auth-line"></div>

      <!-- Error -->
      <div th:if="${error}" class="alerta alerta-error">
        ⚠ <span th:text="${error}"></span>
      </div>

      <form action="/registro" method="post">

        <div class="field">
          <label>Usuario</label>
          <input name="username" type="text" placeholder="Elige un nombre de usuario" required>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input name="password" type="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <button class="btn btn-primary" type="submit" style="margin-top: 0.4rem;">
          Crear Cuenta
        </button>
      </form>

      <div class="auth-sep">o</div>

      <a href="/login" class="btn btn-ghost">Ya tengo cuenta</a>

    </div>
  </div>

</div>
</body>
</html>
