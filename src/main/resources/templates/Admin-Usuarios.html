<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Usuarios — Admin</title>
    <link href="/Style.css" rel="stylesheet">
</head>
<body>

<div class="layout">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-dot"></div>
            <span class="brand-name">Gestión de<br>Eventos</span>
        </div>
        <div class="sidebar-user" th:if="${session.usuario != null}">
            <div class="sidebar-user-avatar"
                 th:text="${session.usuario.username != null ? session.usuario.username.substring(0,1).toUpperCase() : 'A'}">
                A
            </div>
            <div class="sidebar-user-info">
                <div class="sidebar-user-name" th:text="${session.usuario.username}">admin</div>
                <span class="tag-rol" th:text="${session.usuario.rol}">Admin</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <th:block th:if="${session.usuario != null and session.usuario.rol.name() == 'ADMIN'}">
                <span class="sidebar-label">Administración</span>
                <a class="sidebar-link activo" href="/admin/usuarios">
                    <span class="icon">👥</span> Usuarios
                </a>
            </th:block>

            <span class="sidebar-label">General</span>
            <a class="sidebar-link" href="/admin/eventos">
                <span class="icon">📅</span> Gestión Eventos
            </a>

            <span class="sidebar-label">Gestion</span>
            <a class="sidebar-link" href="/eventos">
                <span class="icon">🌐</span> Ver Eventos
            </a>
        </nav>
        <div class="sidebar-footer">
            <a class="sidebar-logout" href="/logout">
                <span class="icon">→</span> Cerrar Sesión
            </a>
        </div>
    </aside>

    <main class="content">
        <div class="page-header">
            <div>
                <h2>Gestión de Usuarios</h2>
                <p>Configura los roles y permisos de acceso al sistema</p>
            </div>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>#</th>
                    <th>Usuario</th>
                    <th>Rol Actual</th>
                    <th>Estado</th>
                    <th>Cambiar Rol</th>
                    <th style="text-align:center">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u : ${usuarios}">
                    <td style="color:var(--texto-muted);font-size:.82rem" th:text="${u.id}"></td>
                    <td><strong th:text="${u.username}"></strong></td>
                    <td>
                            <span class="badge"
                                  th:attr="id='rol-'+${u.id}"
                                  th:classappend="${u.rol.name()=='ADMIN'} ? 'badge-admin' : (${u.rol.name()=='ORGANIZADOR'} ? 'badge-org' : 'badge-part')"
                                  th:text="${u.rol}">
                            </span>
                    </td>
                    <td>
                            <span class="badge"
                                  th:attr="id='estado-'+${u.id}"
                                  th:classappend="${u.bloqueado} ? 'badge-bloq' : 'badge-activo'"
                                  th:text="${u.bloqueado} ? 'Bloqueado' : 'Activo'">
                            </span>
                    </td>

                    <th:block th:if="${u.username != 'admin'}">
                        <td>
                            <select class="select-rol" onchange="cambiarRol(this)" style="padding: 4px 8px; border-radius: var(--radio); border: 1px solid var(--borde);"
                                    th:attr="data-id=${u.id}">
                                <option th:selected="${u.rol.name()=='PARTICIPANTE'}" value="PARTICIPANTE">
                                    Participante
                                </option>
                                <option th:selected="${u.rol.name()=='ORGANIZADOR'}" value="ORGANIZADOR">Organizador
                                </option>
                            </select>
                        </td>
                        <td style="text-align:center">
                            <button class="btn btn-sm"
                                    onclick="cambiarBloqueo(this)"
                                    style="width: 110px"
                                    th:attr="data-id=${u.id}, data-bloqueado=${u.bloqueado}"
                                    th:classappend="${u.bloqueado} ? 'btn-success' : 'btn-danger'"
                                    th:text="${u.bloqueado} ? 'Desbloquear' : 'Bloquear'">
                            </button>
                        </td>
                    </th:block>

                    <td colspan="2" style="text-align: center;" th:if="${u.username == 'admin'}">
                        <span class="badge badge-prot" style="opacity: 0.7">🔒 Cuenta Protegida</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    function toast(msg, tipo = "ok") {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className = `toast toast-${tipo} show`;
        setTimeout(() => t.className = "toast", 2800);
    }

    async function cambiarRol(select) {
        const id = select.dataset.id;
        try {
            const res = await fetch(`/admin/usuarios/${id}/rol`, {
                method: "PATCH",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({rol: select.value})
            });
            const data = await res.json();
            if (!res.ok) {
                toast(data.error || "Error al cambiar rol", "err");
                return;
            }

            const b = document.getElementById(`rol-${id}`);
            b.textContent = data.nuevoRol;
            b.className = "badge " + (data.nuevoRol === "ADMIN" ? "badge-admin" : data.nuevoRol === "ORGANIZADOR" ? "badge-org" : "badge-part");
            toast(`Rol actualizado a ${data.nuevoRol}`);
        } catch (e) {
            toast("Error de red", "err");
        }
    }

    async function cambiarBloqueo(btn) {
        const id = btn.dataset.id;
        try {
            const res = await fetch(`/admin/usuarios/${id}/bloqueo`, {
                method: "PATCH",
                headers: {"Content-Type": "application/json"}
            });
            const data = await res.json();
            if (!res.ok) {
                toast(data.error || "Error en la operación", "err");
                return;
            }

            const e = document.getElementById(`estado-${id}`);
            e.textContent = data.bloqueado ? "Bloqueado" : "Activo";
            e.className = "badge " + (data.bloqueado ? "badge-bloq" : "badge-activo");
            btn.dataset.bloqueado = data.bloqueado;
            btn.textContent = data.bloqueado ? "Desbloquear" : "Bloquear";
            btn.className = "btn btn-sm " + (data.bloqueado ? "btn-success" : "btn-danger");
            toast(data.bloqueado ? "Usuario bloqueado" : "Usuario desbloqueado");
        } catch (e) {
            toast("Error de red", "err");
        }
    }
</script>
</body>
</html>
