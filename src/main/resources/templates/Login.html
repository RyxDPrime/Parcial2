<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="/Style.css">
</head>
<body>
<div class="auth-wrapper">

    <!-- Panel izquierdo decorativo -->
    <div class="auth-panel">
        <div class="auth-panel-title">Gestión de Eventos Académicos</div>
        <p class="auth-panel-sub">Plataforma institucional para la organización, inscripción y control de eventos universitarios.</p>
        <div class="auth-panel-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Panel derecho — formulario -->
    <div class="auth-form-panel">
        <div class="auth-form-box">

            <p class="auth-eyebrow">Bienvenido</p>
            <h2>Iniciar Sesión</h2>
            <div class="auth-line"></div>

            <!-- Error -->
            <div th:if="${error}" class="alerta alerta-error">
                ⚠ <span th:text="${error}"></span>
            </div>

            <form action="/login" method="post">

                <div class="field">
                    <label>Usuario</label>
                    <input name="username" type="text" placeholder="Tu nombre de usuario" required>
                </div>

                <div class="field">
                    <label>Contraseña</label>
                    <input name="password" type="password" placeholder="••••••••" required>
                </div>

                <div class="check-field">
                    <input id="remember" name="remember" type="checkbox">
                    <label for="remember">Recordarme en este equipo</label>
                </div>

                <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
            </form>

            <div class="auth-sep">o</div>

            <a href="/registro" class="btn btn-ghost">Crear nueva cuenta</a>

        </div>
    </div>

</div>
</body>
</html>
