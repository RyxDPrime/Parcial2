<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Iniciar Sesión</title>
    <link href="/Style.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">

    <div class="auth-panel">
        <div class="auth-panel-title">Gestión de Eventos Académicos</div>
        <p class="auth-panel-sub">Plataforma institucional para la organización, inscripción y control de eventos
            universitarios.</p>
        <div class="auth-panel-dots">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="auth-form-panel">
        <div class="auth-form-box">

            <p class="auth-eyebrow">Bienvenido</p>
            <h2>Iniciar Sesión</h2>
            <div class="auth-line"></div>

            <div class="alerta alerta-error" th:if="${error}">
                ⚠ <span th:text="${error}"></span>
            </div>

            <form action="/login" method="post">

                <div class="field">
                    <label>Usuario</label>
                    <input name="username" placeholder="Tu nombre de usuario" required type="text">
                </div>

                <div class="field">
                    <label>Contraseña</label>
                    <input name="password" placeholder="••••••••" required type="password">
                </div>

                <div class="check-field">
                    <input id="remember" name="remember" type="checkbox">
                    <label for="remember">Recordarme en este equipo</label>
                </div>

                <button class="btn btn-primary" type="submit">Iniciar Sesión</button>
            </form>

            <div class="auth-sep">o</div>

            <a class="btn btn-ghost" href="/registro">Crear nueva cuenta</a>

        </div>
    </div>

</div>
</body>
</html>
