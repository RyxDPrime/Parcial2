<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Gestión de Usuarios</h4>
        <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar Sesión</a>
    </div>

    <!-- Alerta de feedback -->
    <div id="alerta" class="alert d-none" role="alert"></div>

    <div class="table-responsive">
        <table class="table table-bordered table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Username</th>
                <th>Rol actual</th>
                <th>Estado</th>
                <th class="text-center">Cambiar Rol</th>
                <th class="text-center">Bloqueo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${usuarios}">
                <td th:text="${u.id}"></td>
                <td th:text="${u.username}"></td>

                <!-- Badge de rol -->
                <td>
                        <span th:classappend="${u.rol.name() == 'ADMIN'} ? 'bg-danger' : (${u.rol.name() == 'ORGANIZADOR'} ? 'bg-primary' : 'bg-secondary')"
                              class="badge"
                              th:text="${u.rol}"
                              th:attr="id='rol-' + ${u.id}">
                        </span>
                </td>

                <!-- Badge de estado -->
                <td>
                        <span th:classappend="${u.bloqueado} ? 'bg-danger' : 'bg-success'"
                              class="badge"
                              th:text="${u.bloqueado} ? 'Bloqueado' : 'Activo'"
                              th:attr="id='estado-' + ${u.id}">
                        </span>
                </td>

                <!-- Selector de rol — deshabilitado para el admin protegido -->
                <td class="text-center" th:if="${u.username != 'admin'}">
                    <select class="form-select form-select-sm w-auto d-inline-block"
                            th:attr="data-id=${u.id}"
                            onchange="cambiarRol(this)">
                        <option value="PARTICIPANTE" th:selected="${u.rol.name() == 'PARTICIPANTE'}">Participante</option>
                        <option value="ORGANIZADOR"  th:selected="${u.rol.name() == 'ORGANIZADOR'}">Organizador</option>
                        <option value="ADMIN"        th:selected="${u.rol.name() == 'ADMIN'}">Administrador</option>
                    </select>
                </td>

                <!-- Bloqueo — deshabilitado para el admin protegido -->
                <td class="text-center" th:if="${u.username != 'admin'}">
                    <button th:attr="data-id=${u.id}, data-bloqueado=${u.bloqueado}"
                            th:text="${u.bloqueado} ? 'Desbloquear' : 'Bloquear'"
                            th:classappend="${u.bloqueado} ? 'btn-outline-success' : 'btn-outline-danger'"
                            class="btn btn-sm"
                            onclick="cambiarBloqueo(this)">
                    </button>
                </td>

                <!-- Celdas vacías para el admin protegido -->
                <td class="text-center text-muted fst-italic" th:if="${u.username == 'admin'}" colspan="2">
                    Protegido
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function mostrarAlerta(mensaje, tipo = "success") {
        const alerta = document.getElementById("alerta");
        alerta.textContent = mensaje;
        alerta.className = `alert alert-${tipo}`;
        setTimeout(() => alerta.className = "alert d-none", 3000);
    }

    async function cambiarRol(select) {
        const id = select.dataset.id;
        const nuevoRol = select.value;

        try {
            const res = await fetch(`/admin/usuarios/${id}/rol`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ rol: nuevoRol })
            });

            if (!res.ok) {
                const err = await res.json();
                mostrarAlerta(err.error, "danger");
                return;
            }

            const data = await res.json();

            // Actualizar badge de rol
            const badge = document.getElementById(`rol-${id}`);
            badge.textContent = data.nuevoRol;
            badge.className = "badge " + (
                data.nuevoRol === "ADMIN" ? "bg-danger" :
                    data.nuevoRol === "ORGANIZADOR" ? "bg-primary" : "bg-secondary"
            );

            mostrarAlerta(`Rol actualizado a ${data.nuevoRol}`);

        } catch (e) {
            mostrarAlerta("Error de conexión", "danger");
        }
    }

    async function cambiarBloqueo(btn) {
        const id = btn.dataset.id;

        try {
            const res = await fetch(`/admin/usuarios/${id}/bloqueo`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" }
            });

            if (!res.ok) {
                const err = await res.json();
                mostrarAlerta(err.error, "danger");
                return;
            }

            const data = await res.json();

            // Actualizar badge de estado
            const badgeEstado = document.getElementById(`estado-${id}`);
            badgeEstado.textContent = data.bloqueado ? "Bloqueado" : "Activo";
            badgeEstado.className = "badge " + (data.bloqueado ? "bg-danger" : "bg-success");

            // Actualizar botón
            btn.dataset.bloqueado = data.bloqueado;
            btn.textContent = data.bloqueado ? "Desbloquear" : "Bloquear";
            btn.className = "btn btn-sm " + (data.bloqueado ? "btn-outline-success" : "btn-outline-danger");

            mostrarAlerta(data.bloqueado ? "Usuario bloqueado" : "Usuario desbloqueado");

        } catch (e) {
            mostrarAlerta("Error de conexión", "danger");
        }
    }
</script>

</body>
</html>
