services:

  web-app:
    image: ryxd/parcial2-eventos:latest
    container_name: parcial2-javalin
    ports:
      - "7070:7070"
    volumes:
      - ./h2data:./app/data
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_URL=jdbc:h2:file:./data/eventos_db
      - DB_USER=sa
      - DB_PASSWORD=
    restart: always
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - eventos-net

  nginx:
    image: nginx:alpine
    container_name: parcial2-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      web-app:
        condition: service_healthy
    restart: always
    networks:
      - eventos-net

  certbot:
    image: certbot/certbot:latest
    container_name: parcial2-certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  certbot-certs:
  certbot-webroot:

networks:
  eventos-net:
    driver: bridge